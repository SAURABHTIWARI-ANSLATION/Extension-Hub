<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevToolkit Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="popup">

    <!-- HEADER -->
    <div class="header">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">DevToolkit Pro</span>
        <span class="brand-version">v1.0 · Chrome Extension</span>
      </div>
      <div class="header-pills">
        <div class="pill"><div class="pill-dot"></div>Active</div>
        <button class="icon-btn" title="Command palette" id="btn-command">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
        </button>
        <button class="icon-btn" title="Dark mode" id="btn-dark-mode">
          <svg id="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg id="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="search-bar">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" placeholder="Search 40+ tools..." id="search-input" />
      <div class="search-meta">
        <kbd class="kbd">⌘K</kbd>
        <kbd class="kbd">40 tools</kbd>
      </div>
    </div>

    <!-- PAGE INFO -->
    <div class="page-info">
      <div class="page-url" id="page-url">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </div>
      <div class="page-badge" id="page-status">● Connected</div>
    </div>

    <!-- PINNED TOOLS -->
    <div class="pinned-section" id="pinned-section" hidden>
      <span class="section-label">Pinned Tools</span>
      <div class="pinned-grid" id="pinned-tools"></div>
    </div>

    <!-- MAIN SCROLLABLE AREA -->
    <div id="main">

      <!-- SEARCH RESULTS (shown when searching) -->
      <div id="search-results" hidden>
        <div id="search-results-list"></div>
      </div>

      <!-- GROUPS CONTAINER (shown when not searching) -->
      <div id="groups-container">
        <!-- TABS -->
        <div class="tab-bar" id="group-tabs"></div>
        <!-- PANELS -->
        <div id="group-panels"></div>
      </div>

    </div>

    <!-- RESULT PANEL -->
    <div class="result-panel" id="result-panel" hidden>
      <div class="result-header">
        <div class="result-header-left">
          <button class="icon-btn icon-btn-sm" id="result-panel-close">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="result-title" id="result-panel-title">Result</span>
        </div>
        <button class="icon-btn icon-btn-sm" id="result-panel-close-x" title="Close">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="result-body" id="result-panel-body"></div>
      <div class="result-footer">
        <button class="run-btn" id="result-export-btn">Export JSON</button>
        <button class="run-btn run-btn-primary" id="result-done-btn">Done</button>
      </div>
    </div>

    <!-- COMMAND PALETTE -->
    <div class="cmd-backdrop" id="command-palette" hidden>
      <div id="command-backdrop"></div>
      <div class="cmd-modal">
        <div class="cmd-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input class="cmd-input" placeholder="Search tools or commands..." id="command-input" />
          <kbd class="kbd">ESC</kbd>
        </div>
        <div class="cmd-list" id="command-list"></div>
      </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
