<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Break Complete</title>
  <link rel="stylesheet" href="pomodoro-alert.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="card" role="dialog" aria-live="polite">
    <div class="icon" aria-hidden="true"></div>
    <h1 class="title">Break complete</h1>
    <p class="subtitle">Ready to start your next focus session?</p>

    <div class="btn-row">
      <button class="btn btn-ghost" id="closeBtn">Close</button>
      <button class="btn btn-primary" id="startBtn">Start Focus</button>
    </div>
  </main>

  <script src="pomodoro-alert.js"></script>
</body>
</html>
